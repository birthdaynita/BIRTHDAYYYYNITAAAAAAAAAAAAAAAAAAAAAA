<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0b10;--bg2:#1a1a22;--gold:#d9b873;--gold2:#f3dca4;--ink:#f4ead6;--soft:#b9ab8c;--rose:#ff5a6e;
  --serif:'Cormorant Garamond',Georgia,serif;--caps:'Cinzel','Cormorant Garamond',Georgia,serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--serif);
  background:radial-gradient(120% 90% at 50% 20%,var(--bg2),var(--bg) 70%)}
#bokeh{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(217,184,115,.55),rgba(217,184,115,.08) 70%);filter:blur(14px);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0) scale(1);opacity:0}15%{opacity:.7}85%{opacity:.6}to{transform:translateY(-120px) scale(1.25);opacity:0}}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#app{position:fixed;inset:0;z-index:2;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:34px 28px;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.scr.on{opacity:1;visibility:visible}
.frame{position:fixed;inset:14px;border:1px solid rgba(217,184,115,.35);pointer-events:none;z-index:3;border-radius:2px}

.caps{font-family:var(--caps);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.btn{appearance:none;cursor:pointer;background:rgba(217,184,115,.06);color:var(--gold2);border:1px solid var(--gold);
  font:500 12px var(--caps);letter-spacing:.32em;text-transform:uppercase;padding:16px 30px;transition:.25s}
.btn:hover{background:rgba(217,184,115,.18);box-shadow:0 0 28px rgba(217,184,115,.3)}
.btn:focus-visible,.nav:focus-visible,.tile:focus-within{outline:2px solid var(--gold2);outline-offset:4px}
.btn:active{transform:scale(.97)}

/* 0 loader */
.ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(217,184,115,.25);border-top-color:var(--gold2);animation:spin 1s linear infinite}
.bar{width:140px;height:1px;background:rgba(217,184,115,.2);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--gold2)}
.on .bar b{animation:fill 2.4s ease forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{to{width:100%}}

/* 1 intro */
.mono{font:italic 500 clamp(110px,34vw,190px)/1 var(--serif);color:var(--gold2);text-shadow:0 0 50px rgba(217,184,115,.5)}
.intro>*{opacity:0}
.intro.on .mono{animation:rise 1.4s .2s forwards}
.intro.on h1{animation:rise 1.2s 1.6s forwards}
.intro.on .sub{animation:rise 1.2s 2.6s forwards}
.intro.on .tap{animation:rise 1s 3.8s forwards,pulse 2s 4.8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pulse{50%{opacity:.35}}
h1{margin:0;font:500 clamp(34px,10vw,58px)/1.1 var(--serif);letter-spacing:.02em}
.sub{font-style:italic;font-size:clamp(18px,5vw,24px);color:var(--soft);margin:0}
.tap{font-family:var(--caps);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin:14px 0 0;cursor:pointer}
.intro{cursor:pointer}

/* 2 countdown */
#num{font:italic 500 clamp(130px,40vw,230px)/1 var(--serif);color:var(--gold2);text-shadow:0 0 60px rgba(217,184,115,.6)}
#num.pop{animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(1.6);filter:blur(10px)}25%{opacity:1;transform:scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
.cd{position:relative;display:grid;place-items:center;width:min(70vw,320px);aspect-ratio:1}
.cd::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(217,184,115,.4);animation:spin 3s linear infinite;border-top-color:var(--gold2)}

/* 3 name */
.name{font:italic 500 clamp(44px,13vw,84px)/1.05 var(--serif);margin:0;color:var(--gold2);text-shadow:0 0 40px rgba(217,184,115,.4)}
.line{width:60px;height:1px;background:var(--gold)}

/* 4 grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(520px,100%)}
.tile{position:relative;aspect-ratio:3/4;display:grid;place-items:center;border:1px solid rgba(217,184,115,.4);cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,rgba(217,184,115,.1),rgba(255,255,255,.02))}
.tile img,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile input,.stage input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ph{font:italic 400 15px var(--serif);color:var(--soft);padding:8px}

/* 5 viewer */
.view{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;height:min(50vh,540px);height:min(50dvh,540px);max-width:100%;aspect-ratio:3/4;border:1px solid rgba(217,184,115,.5);display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,rgba(217,184,115,.1),rgba(255,255,255,.02));box-shadow:0 20px 60px rgba(0,0,0,.5)}
.stage img{transition:opacity .5s}
.cap{min-height:2.9em;margin:0;font:italic 400 clamp(16px,4.4vw,20px)/1.4 var(--serif);color:var(--ink);transition:opacity .4s}
.ctrl{display:flex;align-items:center;gap:18px}
.nav{appearance:none;background:none;border:1px solid var(--gold);color:var(--gold2);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;transition:.25s}
.nav:hover{background:rgba(217,184,115,.18)}
.dots{display:flex;gap:8px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(217,184,115,.3);transition:.3s}.dots i.a{background:var(--gold2);transform:scale(1.4)}

/* viewer: foto kiri, tulisan kanan */
.view{width:min(820px,100%)}
.pair{display:flex;align-items:stretch;justify-content:center;width:100%}
.pair .stage{height:min(54vh,440px);height:min(54dvh,440px);max-width:46%;flex:none}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:22px 26px;
  background:linear-gradient(160deg,#171a2b,#0f111c);border:1px solid rgba(217,184,115,.5);border-left:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.orn{width:34px;height:1px;background:var(--gold)}
.panel .cap{min-height:0;text-align:left;font-size:clamp(16px,2.3vw,22px);line-height:1.6;color:var(--ink)}
@media (max-width:600px){
  .pair{flex-direction:column;align-items:center}
  .pair .stage{height:min(38vh,320px);height:min(38dvh,320px);max-width:100%}
  .panel{width:100%;border-left:1px solid rgba(217,184,115,.5);border-top:0;padding:16px 20px;gap:10px;align-items:center}
  .panel .cap{text-align:center;font-size:clamp(15px,4.2vw,18px);line-height:1.5}
}
/* 6 final */
.hb{font:500 clamp(40px,12.5vw,92px)/1.02 var(--serif);letter-spacing:.04em;margin:0;color:var(--gold2);text-shadow:0 0 50px rgba(217,184,115,.5)}
.heart{color:var(--rose);font-size:30px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{40%{transform:scale(1.2)}}
.wish{max-width:30ch;margin:0;font-style:italic;font-size:clamp(18px,5vw,24px);line-height:1.5;color:var(--soft)}
.fin>*{opacity:0}
.fin.on .hb{animation:rise 1.6s .3s forwards}.fin.on .heart{animation:rise 1s 1.4s forwards,beat 1.6s 2.4s infinite}
.fin.on .wish{animation:rise 1.4s 2s forwards}.fin.on .btn{animation:rise 1.2s 3.2s forwards}
#save{position:fixed;top:calc(env(safe-area-inset-top,0px) + 26px);right:26px;z-index:5;padding:10px 14px;font-size:10px;background:rgba(11,11,16,.85)}
@media (prefers-reduced-motion:reduce){#bokeh i,.ring,.cd::before{animation:none}}
</style>
</head>
<body>
<div id="bokeh" aria-hidden="true"></div>
<canvas id="fw" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>
<button class="btn" id="save" type="button" hidden>Simpan jadi 1 file</button>
<div id="app">
  <section class="scr on" id="s0" aria-label="Memuat"><div class="ring"></div><div class="bar"><b></b></div></section>

  <section class="scr intro" id="s1"><div class="mono" id="ini">A</div><h1 id="ttl">A little Gift</h1><p class="sub" id="sub">Made for secret hehehe</p><p class="tap">tap in here</p></section>

  <section class="scr" id="s2" aria-live="polite"><div class="cd"><div id="num">3</div></div></section>

  <section class="scr" id="s3"><p class="caps">for</p><h2 class="name" id="nm">Nama Kamu</h2><div class="line"></div><p class="sub">I made this for you</p><button class="btn" id="b3" type="button">Let it begin</button></section>

  <section class="scr" id="s4"><p class="caps">a few moments</p><div class="grid" id="grid"></div><button class="btn" id="b4" type="button">Continue</button></section>

  <section class="scr" id="s5"><div class="view">
    <div class="pair"><div class="stage" id="stage"></div><div class="panel"><div class="orn"></div><p class="cap" id="cap"></p></div></div>
    <div class="ctrl"><button class="nav" id="prev" type="button" aria-label="Sebelumnya">&#8592;</button><div class="dots" id="dots"></div><button class="nav" id="next" type="button" aria-label="Berikutnya">&#8594;</button></div>
    <button class="btn" id="b5" type="button">Continue</button></div></section>

  <section class="scr fin" id="s6"><h2 class="hb">HAPPY<br>BIRTHDAY</h2><div class="heart">&#9825;</div><p class="wish" id="wish">May every wish you whisper tonight find its way back to you.</p><button class="btn" id="b6" type="button">Replay the gift</button></section>
</div>

/* foto */
function pick(inp,i){inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    P[i].src=c.toDataURL('image/jpeg',.82);$('save').hidden=false;render();view();};im.src=r.result;};r.readAsDataURL(f);};}
$('save').onclick=function(){
  var c=document.documentElement.cloneNode(true),g=function(i){return c.querySelector('#'+i)};
  ['bokeh','grid','stage','dots'].forEach(function(i){g(i).innerHTML=''});
  g('cap').textContent='';g('cap').removeAttribute('style');g('save').remove();
  c.querySelectorAll('.scr').forEach(function(e){e.classList.remove('on')});g('s0').classList.add('on');
  var sc=c.querySelector('script'),m='/*PH'+'*/',e='/*/PH'+'*/',t=sc.textContent,a=t.indexOf(m),b=t.indexOf(e);
  sc.textContent=t.slice(0,a)+m+JSON.stringify(P)+t.slice(b);
  var l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));
  l.download='birthday-gift.html';document.body.appendChild(l);l.click();l.remove();};
function cell(cls,i){var h=document.createElement('label');h.className=cls;
  if(P[i].src){var im=document.createElement('img');im.src=P[i].src;im.alt='Foto '+(i+1);h.appendChild(im);}
  else{var t=document.createElement('span');t.className='ph';t.textContent='+ ketuk untuk pilih foto';h.appendChild(t);}
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('aria-label','Pilih foto '+(i+1));pick(inp,i);h.appendChild(inp);return h;}
function render(){var g=$('grid');g.innerHTML='';P.forEach(function(_,i){g.appendChild(cell('tile',i))});}
function view(){var st=$('stage');st.innerHTML='';var c=cell('',cur);c.style.cssText='position:absolute;inset:0;display:grid;place-items:center';st.appendChild(c);
  var cp=$('cap');cp.style.opacity=0;setTimeout(function(){cp.textContent=P[cur].cap;cp.style.opacity=1},180);
  var ds=$('dots');ds.innerHTML='';P.forEach(function(_,i){var d=document.createElement('i');if(i===cur)d.className='a';ds.appendChild(d)});}

/* kembang api */
var cv=$('fw'),cx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W,H,parts=[],rockets=[],run=false,timer=null,last=0;
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
size();addEventListener('resize',size);
var COLS=['#f3dca4','#d9b873','#ffffff','#ff8a9a','#ffd27a'];
function burst(x,y){var base=COLS[Math.floor(Math.random()*COLS.length)];
  for(var i=0;i<90;i++){var a=Math.random()*6.283,s=Math.random()*5.5+.8;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,dec:.009+Math.random()*.012,c:Math.random()<.7?base:'#ffffff',z:1+Math.random()*1.6});}}
function rocket(x,ty){rockets.push({x:x||W*(.15+Math.random()*.7),y:H,ty:ty||H*(.15+Math.random()*.4),vy:-(9+Math.random()*3)});}
function loop(t){if(!run)return;
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  rockets=rockets.filter(function(r){r.y+=r.vy;r.vy*=.985;cx.fillStyle='#f3dca4';cx.fillRect(r.x,r.y,2,8);
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y);return false}return true});
  parts=parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.l-=p.dec;if(p.l<=0)return false;
    cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.z,0,6.283);cx.fill();return true});
  cx.globalAlpha=1;requestAnimationFrame(loop);}
function fwStart(){if(run)return;run=true;parts=[];rockets=[];requestAnimationFrame(loop);
  var n=0;timer=setInterval(function(){rocket();if(Math.random()<.5)setTimeout(rocket,200);},850);
  setTimeout(rocket,300);setTimeout(rocket,700);}
function fwStop(){run=false;clearInterval(timer);cx.clearRect(0,0,W,H);}
addEventListener('pointerdown',function(e){if(run&&!e.target.closest('button'))rocket(e.clientX,e.clientY);});

boot();
})();
</script>
</body>
</html>
